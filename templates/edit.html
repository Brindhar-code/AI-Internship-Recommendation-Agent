<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Internship</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="logo">
        AI Internship Recommendation - Admin
    </div>

    <nav>
        <a href="{{ url_for('admin') }}">Admin Dashboard</a>
        <a href="{{ url_for('students') }}">Students</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>

</header>

<main class="form-container">

    <div class="form-card">

        <h1>Edit Internship</h1>

        <form method="POST">

            <div class="form-group">

                <label for="title">
                    Internship Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ internship.title }}"
                    required>

            </div>


            <div class="form-group">

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ internship.company }}"
                    required>

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ internship.location }}">

            </div>


            <div class="form-group">

                <label for="skills">
                    Required Skills
                </label>

                <input
                    type="text"
                    id="skills"
                    name="skills"
                    value="{{ internship.skills }}">

            </div>


            <div class="form-group">

                <label for="duration">
                    Duration
                </label>

                <input
                    type="text"
                    id="duration"
                    name="duration"
                    value="{{ internship.duration }}">

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="6">{{ internship.description }}</textarea>

            </div>


            <button type="submit" class="btn full-btn">
                Update Internship
            </button>

        </form>

        <br>

        <a
            href="{{ url_for('admin') }}"
            class="btn secondary-btn">
            Back to Admin
        </a>

    </div>

</main>

</body>
</html>
